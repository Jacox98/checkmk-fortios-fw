[package]

name = fortigate_firmware
title = FortiGate Firewall Firmware Monitoring
author = Jacox98 && arag0re
description = CheckMK extension for monitoring FortiGate firewalls via the REST API (firmware version, updates, and status).

version.min_required = 2.5.0
version.packaged = 2.4.0p37
version.usable_until = 3.0.0

validate_python = true
validate-mkp = true 

output-dir = build

category = Networking
license = GPL-3.0
tags = fortigate, firewall, restapi, firmware, licenses
download_url = https://github.com/arag0re/checkmk-fortios-fw
